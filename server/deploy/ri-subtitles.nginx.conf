# Managed by R&I Camera's installer. Included ONLY inside djcioko.ro TLS vhost.
location ^~ /api/ri-subtitles/ {
    client_max_body_size 512m;
    client_body_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host djcioko.ro;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_pass http://unix:/run/ri-subtitles/api.sock:/;
    # API uses bearer authorization, never cookies; uploads and results stay private.
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
