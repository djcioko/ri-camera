<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070707" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>R&I Camera — Șantier</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/logo.png" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="top-meta">
        <strong>R&amp;I CAMERA</strong>
        <input id="siteName" type="text" placeholder="Nume șantier (ex. Pipera)" />
      </div>
      <button id="btnHideCtrl" class="icon-btn" title="Ascunde / Arată Controale">👁️</button>
      <button id="btnLibrary" class="icon-btn" title="Arhivă clipuri">📁 <span id="clipCount">0</span></button>
    </header>

    <main class="stage" id="stageArea">
      <video id="liveVideo" playsinline muted autoplay></video>
      
      <!-- Logo și Poză Site -->
      <div id="draggableLogo" class="draggable-item" title="Trage de logo să-l muți">
        <img src="assets/logo.png" alt="Logo R&I" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'90\' height=\'40\'><text x=\'0\' y=\'30\' fill=\'%23e2c14a\' font-size=\'20\' font-weight=\'bold\'>R&I</text></svg>';" />
      </div>
      <div id="draggableSite" class="draggable-item" title="Trage de poza site să o muți">
        <img src="assets/telefon.png" alt="Telefon" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'130\' height=\'30\'><text x=\'0\' y=\'20\' fill=\'%23e2c14a\' font-size=\'14\' font-weight=\'bold\'>0727.300.302</text></svg>';" />
      </div>

      <!-- Buton Flip -->
      <button id="btnFlipBig" class="big-flip-btn" title="Schimbă Camera">🔄</button>

      <div class="hud-top-left"><span id="techInfoBadge" class="tech-badge">1080p / 60 FPS</span></div>
      <div id="recBadge" class="rec-badge hidden">● REC <span id="recTime">00:00</span></div>
      
      <div class="vu-wrap"><div class="vu-bar"><div id="vuFill"></div></div></div>
      <div id="lockBadge" class="lock-badge hidden">FOCUS FIX</div>
    </main>

    <section id="controlPanel" class="controls">
      <div class="row-btns">
        <button id="btnGrid" class="pill">▦ Grid</button>
        <button id="btnLock" class="pill">🔒 Focus Auto/Fix</button>
        <button id="btnFullscreen" class="pill">⛶ Fullscreen</button>
      </div>
      <div class="sliders">
        <label>Lumină <input id="sBright" type="range" min="50" max="180" value="100" /></label>
        <label>Contrast <input id="sContrast" type="range" min="50" max="200" value="100" /></label>
      </div>
      <div class="actions">
        <button id="btnReset" class="pill">Reset</button>
        <button id="btnRec" class="rec-btn" aria-label="Înregistrează"></button>
        <label class="pill chk"><input id="chkDate" type="checkbox" checked /> Dată &amp; Șantier</label>
      </div>
    </section>
  </div>

  <aside id="library" class="drawer hidden">
    <div class="drawer-head">
      <h2>Arhivă Filmată (Play & Download)</h2>
      <button id="btnCloseLib" class="icon-btn">✕ Închide</button>
    </div>
    <div id="clipList" class="clip-list"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
