<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ri-camera PWA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Ecranul Camerei Video -->
        <div id="camera-view">
            <video id="video-preview" autoplay playsinline muted></video>
            
            <!-- Suprapuneri peste cameră -->
            <div id="camera-overlay">
                <div id="info-badge">1080p • 60 FPS</div>
                <div id="vumeter-container">
                    <div id="vumeter-bar"></div>
                </div>
            </div>

            <!-- Controale pe cameră -->
            <div id="camera-controls">
                <button id="btn-switch-cam" class="btn-blue">Față / Spate</button>
                <button id="btn-record" class="btn-red">● REC</button>
                <button id="btn-fullscreen" class="btn-gray">⛶ Fullscreen</button>
            </div>
        </div>

        <!-- Player Video / Previzualizare (Modal / Coadă) -->
        <div id="playback-modal" class="hidden">
            <div class="modal-content">
                <button id="btn-close-modal" class="btn-close">×</button>
                <video id="video-player" controls playsinline></video>
            </div>
        </div>

        <!-- Coada / Rândul de fișiere în funcție de când s-a filmat -->
        <div id="recording-queue">
            <h3>Înregistrări salvate</h3>
            <div id="queue-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
